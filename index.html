<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02070b">
<title>LOE MOBIL | Tienda</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#05090d;
  --nav:#02070b;
  --panel:#0a151d;
  --panel2:#0d1d27;
  --blue:#00bfff;
  --blue2:#0095e8;
  --border:#143d52;
  --text:#fff;
  --muted:#95a4ad;
  --green:#19c86c;
  --yellow:#ffbf00;
  --red:#ff626d;
}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.top{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(2,7,11,.98);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

.header-main{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 14px 8px;
}

.brand{min-width:max-content}

.brand-main{
  font-size:24px;
  line-height:1;
  font-weight:950;
}

.brand-main span{color:var(--blue)}

.brand-sub{
  margin-top:5px;
  font-size:8px;
  letter-spacing:4px;
  text-align:center;
  color:#bcc8cf;
}

/* CUENTA */

.account-btn{
  margin-left:auto;
  min-height:44px;
  max-width:165px;
  padding:0 12px;
  overflow:hidden;
  border:1px solid #146084;
  border-radius:10px;
  background:#07141d;
  color:white;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.account-btn.logged{
  border-color:#138653;
}

.cart-btn{
  min-height:44px;
  padding:0 13px;
  border:1px solid #146084;
  border-radius:10px;
  background:#07141d;
  color:white;
  font-weight:900;
  white-space:nowrap;
}

.cart-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:21px;
  height:21px;
  margin-left:5px;
  border-radius:50%;
  background:var(--blue);
  color:#00131b;
  font-size:12px;
}

.search-row{
  max-width:1400px;
  margin:auto;
  padding:0 14px 11px;
}

.search{
  display:flex;
  height:47px;
  overflow:hidden;
  border:1px solid #31566b;
  border-radius:10px;
  background:#0b1821;
}

.search input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  padding:0 15px;
  background:transparent;
  color:white;
}

.search input::placeholder{color:#88959e}

.search button{
  width:56px;
  border:0;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-size:21px;
}

.categories-wrap{
  overflow-x:auto;
  scrollbar-width:none;
  background:#030b11;
  border-top:1px solid rgba(0,191,255,.1);
}

.categories-wrap::-webkit-scrollbar{display:none}

.categories{
  max-width:1400px;
  margin:auto;
  display:flex;
  padding:0 8px;
}

.categories button{
  flex:0 0 auto;
  min-width:105px;
  padding:13px 14px;
  border:0;
  border-right:1px solid #112936;
  background:transparent;
  color:#dce5e9;
  font-weight:800;
}

.categories button.active{
  background:rgba(0,191,255,.13);
  color:white;
  box-shadow:inset 0 -3px var(--blue);
}

.quick{
  max-width:1400px;
  margin:12px auto 0;
  padding:0 12px;
}

.quick-box{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.quick-box::-webkit-scrollbar{display:none}

.quick-item{
  flex:0 0 auto;
  padding:9px 12px;
  border:1px solid #174960;
  border-radius:20px;
  background:#09151e;
  color:#cbd7dd;
  font-size:12px;
  font-weight:750;
}

/* PRODUCTOS */

main{
  max-width:1400px;
  margin:auto;
  padding:14px 10px 60px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.section-head h1{
  margin:0;
  font-size:25px;
}

.result-count{
  color:var(--blue);
  font-size:13px;
}

.status{
  padding:25px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#07131d;
  color:#a9b6bd;
  text-align:center;
}

.products{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
}

.card{
  overflow:hidden;
  border-radius:11px;
  background:white;
  color:#111;
  box-shadow:0 4px 18px rgba(0,0,0,.3);
}

.product-main{cursor:pointer}

.photo{
  position:relative;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:7px;
}

.no-image{
  color:#999;
  font-size:12px;
}

.badge{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 7px;
  border-radius:5px;
  background:#07131d;
  color:white;
  font-size:9px;
  font-weight:900;
}

.card-info{padding:9px 10px 7px}

.card-name{
  min-height:37px;
  font-size:14px;
  line-height:1.3;
  font-weight:850;
}

.card-meta{
  min-height:16px;
  margin-top:3px;
  color:#707980;
  font-size:11px;
}

.card-price{
  margin-top:7px;
  font-size:19px;
  font-weight:950;
}

.card-stock{
  margin-top:4px;
  color:#079c4e;
  font-size:11px;
  font-weight:800;
}

.card-actions{padding:0 9px 10px}

.add{
  width:100%;
  padding:9px 5px;
  border:0;
  border-radius:7px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:900;
}

.whatsapp{
  position:fixed;
  right:18px;
  bottom:20px;
  z-index:150;
  width:58px;
  height:58px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#15c96c;
  color:white;
  text-decoration:none;
  font-size:28px;
  box-shadow:0 5px 25px rgba(21,201,108,.35);
}

/* CARRITO */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.72);
}

.overlay.show{display:block}

.drawer{
  position:absolute;
  right:0;
  top:0;
  width:min(430px,94vw);
  height:100%;
  display:flex;
  flex-direction:column;
  background:#07131d;
  border-left:1px solid #0879a8;
}

.drawer-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px;
  border-bottom:1px solid var(--border);
}

.drawer-head h2{margin:0}

.close{
  border:0;
  background:transparent;
  color:white;
  font-size:29px;
}

#cartItems{
  flex:1;
  overflow:auto;
  padding:15px;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #163646;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:contain;
  background:white;
}

.cart-info{flex:1}

.cart-name{
  margin-bottom:4px;
  font-weight:850;
}

.remove{
  margin-top:5px;
  padding:0;
  border:0;
  background:transparent;
  color:#ff7777;
}

.cart-footer{
  padding:18px;
  border-top:1px solid var(--border);
}

.cart-total{
  margin-bottom:12px;
  font-size:20px;
  font-weight:950;
}

.checkout{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:900;
}

/* CUENTA */

.auth-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:600;
  padding:15px;
  overflow:auto;
  background:rgba(0,0,0,.84);
}

.auth-modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.auth-box{
  width:min(440px,100%);
  overflow:hidden;
  border:1px solid #0c7199;
  border-radius:17px;
  background:#07131d;
  box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.auth-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 17px;
  border-bottom:1px solid #15394c;
}

.auth-logo{
  font-size:20px;
  font-weight:950;
}

.auth-logo span{color:var(--blue)}

.auth-close{
  border:0;
  background:transparent;
  color:white;
  font-size:30px;
}

.auth-body{padding:17px}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:18px;
  padding:4px;
  border-radius:10px;
  background:#0b1c27;
}

.auth-tab{
  padding:10px 6px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#8fa1aa;
  font-size:13px;
  font-weight:850;
}

.auth-tab.active{
  background:#123247;
  color:white;
}

.auth-form{display:none}
.auth-form.active{display:block}

.auth-title{
  margin:0 0 5px;
  font-size:23px;
}

.auth-desc{
  margin:0 0 16px;
  color:#91a4ae;
  font-size:13px;
  line-height:1.45;
}

.auth-field{margin-bottom:12px}

.auth-field label{
  display:block;
  margin-bottom:6px;
  color:#c8d3d9;
  font-size:12px;
  font-weight:800;
}

.auth-field input{
  width:100%;
  min-height:46px;
  padding:0 12px;
  border:1px solid #274d60;
  border-radius:9px;
  outline:0;
  background:#0b1a24;
  color:white;
}

.auth-field input:focus{
  border-color:var(--blue);
}

.auth-submit{
  width:100%;
  min-height:47px;
  margin-top:3px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:950;
}

.auth-submit:disabled{opacity:.55}

.auth-message{
  display:none;
  margin-top:13px;
  padding:10px 11px;
  border-radius:8px;
  font-size:12px;
  line-height:1.45;
}

.auth-message.show{display:block}

.auth-message.error{
  border:1px solid #7a3238;
  background:#2d1115;
  color:#ffb9bf;
}

.auth-message.success{
  border:1px solid #166744;
  background:#0b291c;
  color:#a6efc9;
}

.profile-panel{
  text-align:center;
}

.profile-avatar{
  width:72px;
  height:72px;
  margin:3px auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid var(--blue);
  border-radius:50%;
  background:#092432;
  color:var(--blue);
  font-size:29px;
  font-weight:950;
}

.profile-name{
  font-size:21px;
  font-weight:950;
}

.profile-email{
  margin-top:5px;
  color:#91a4ae;
  font-size:12px;
}

.profile-info{
  margin-top:16px;
  padding:11px;
  border:1px solid #183e51;
  border-radius:9px;
  background:#091923;
  color:#b7c5cc;
  font-size:12px;
  line-height:1.5;
}

.logout-btn{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:1px solid #753037;
  border-radius:9px;
  background:#2b1014;
  color:#ffabb4;
  font-weight:900;
}

/* DETALLE */

.product-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:400;
  padding:12px;
  overflow:auto;
  background:rgba(0,0,0,.82);
}

.product-modal.show{display:block}

.detail{
  width:min(900px,100%);
  margin:14px auto;
  overflow:hidden;
  border:1px solid #0c7199;
  border-radius:15px;
  background:#07131d;
}

.detail-head{
  display:flex;
  justify-content:flex-end;
  padding:5px 8px 0;
}

.detail-close{
  border:0;
  background:transparent;
  color:white;
  font-size:31px;
}

.detail-body{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  padding:14px 16px 18px;
}

/* GALERÍA */

.gallery-wrap{min-width:0}

.gallery-shell{position:relative}

.gallery{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  scrollbar-width:none;
  border-radius:12px;
  background:white;
  -webkit-overflow-scrolling:touch;
}

.gallery::-webkit-scrollbar{display:none}

.gallery-slide{
  flex:0 0 100%;
  width:100%;
  height:430px;
  display:flex;
  align-items:center;
  justify-content:center;
  scroll-snap-align:start;
  background:white;
}

.gallery-slide img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:8px;
}

.gallery-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  width:38px;
  height:38px;
  border:1px solid rgba(0,0,0,.12);
  border-radius:50%;
  background:rgba(255,255,255,.92);
  color:#07131d;
  font-size:23px;
  font-weight:900;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.gallery-arrow.left{left:8px}
.gallery-arrow.right{right:8px}

.gallery-thumbs{
  display:flex;
  gap:7px;
  margin-top:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.gallery-thumbs::-webkit-scrollbar{display:none}

.gallery-thumb{
  flex:0 0 52px;
  width:52px;
  height:52px;
  padding:2px;
  overflow:hidden;
  border:2px solid transparent;
  border-radius:8px;
  background:white;
}

.gallery-thumb.active{border-color:var(--blue)}

.gallery-thumb img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.gallery-counter{
  margin-top:5px;
  color:#9eabb2;
  text-align:center;
  font-size:11px;
}

.detail-brand{
  color:var(--blue);
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
}

.detail-title{
  margin:5px 0 7px;
  font-size:30px;
}

.detail-price{
  margin:10px 0;
  color:var(--blue);
  font-size:30px;
  font-weight:950;
}

.detail-stock{
  color:#37d47d;
  font-weight:850;
}

.detail-specs{
  display:grid;
  gap:7px;
  margin-top:14px;
}

.detail-specs div{
  padding:9px 10px;
  border-radius:7px;
  background:#0c1d28;
  font-size:14px;
}

.detail-desc{
  margin-top:14px;
  color:#c2ced4;
  line-height:1.5;
}

.detail-add{
  width:100%;
  margin-top:16px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:950;
}

/* RESEÑAS */

.reviews-section{
  grid-column:1/-1;
  padding-top:19px;
  border-top:1px solid #174052;
}

.reviews-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:13px;
}

.reviews-head h3{
  margin:0;
  font-size:21px;
}

.rating-summary{
  color:var(--yellow);
  font-size:13px;
  font-weight:900;
  text-align:right;
}

.review-card{
  margin-bottom:9px;
  padding:13px;
  border:1px solid #183d4e;
  border-radius:10px;
  background:#091821;
}

.review-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.review-name{
  font-size:14px;
  font-weight:900;
}

.review-date{
  margin-top:3px;
  color:#82939c;
  font-size:10px;
}

.review-stars{
  color:var(--yellow);
  letter-spacing:1px;
  white-space:nowrap;
}

.review-comment{
  margin-top:8px;
  color:#d2dde1;
  font-size:13px;
  line-height:1.5;
}

.review-empty{
  padding:14px;
  border:1px solid #183a4b;
  border-radius:9px;
  background:#091821;
  color:#93a5ae;
  font-size:13px;
  text-align:center;
}

.review-form{
  margin-top:15px;
  padding:14px;
  border:1px solid #17526b;
  border-radius:11px;
  background:#091a24;
}

.review-form h4{
  margin:0 0 12px;
  font-size:17px;
}

.star-picker{
  display:flex;
  gap:4px;
  margin-bottom:11px;
}

.star-picker button{
  padding:0;
  border:0;
  background:transparent;
  color:#50616a;
  font-size:31px;
}

.star-picker button.active{
  color:var(--yellow);
}

.review-form textarea{
  width:100%;
  min-height:100px;
  padding:11px;
  resize:vertical;
  border:1px solid #285063;
  border-radius:9px;
  outline:0;
  background:#07131d;
  color:white;
}

.review-form textarea:focus{
  border-color:var(--blue);
}

.review-submit{
  width:100%;
  margin-top:9px;
  padding:11px;
  border:0;
  border-radius:8px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:900;
}

.review-login{
  padding:13px;
  border:1px solid #194a60;
  border-radius:9px;
  background:#081720;
  color:#b7c4ca;
  text-align:center;
  font-size:13px;
  line-height:1.5;
}

.review-login button{
  margin-top:9px;
  padding:9px 15px;
  border:0;
  border-radius:8px;
  background:var(--blue);
  color:#00141d;
  font-weight:900;
}

.review-notice{
  display:none;
  margin-top:9px;
  padding:9px;
  border-radius:8px;
  font-size:12px;
}

.review-notice.show{display:block}

.review-notice.good{
  background:#0b2b1a;
  color:#9cf0c2;
}

.review-notice.bad{
  background:#311111;
  color:#ffb7b7;
}

/* RESPONSIVE */

@media(max-width:1100px){
  .products{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(max-width:820px){
  .products{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:650px){

  .header-main{
    padding:11px 9px 8px;
    gap:6px;
  }

  .brand-main{font-size:19px}

  .brand-sub{
    font-size:6px;
    letter-spacing:3px;
  }

  .account-btn{
    max-width:88px;
    min-height:41px;
    padding:0 7px;
    font-size:10px;
  }

  .cart-btn{
    min-height:41px;
    padding:0 8px;
    font-size:12px;
  }

  .cart-count{
    min-width:18px;
    height:18px;
    font-size:10px;
  }

  .search-row{
    padding:0 10px 10px;
  }

  .categories button{
    min-width:92px;
    padding:12px 11px;
    font-size:13px;
  }

  .quick{padding:0 8px}

  main{
    padding:13px 7px 55px;
  }

  .section-head h1{font-size:23px}

  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }

  .card{border-radius:9px}

  .photo img{padding:4px}

  .card-info{
    padding:8px 8px 6px;
  }

  .card-name{
    min-height:34px;
    font-size:12.5px;
  }

  .card-meta{font-size:9.5px}
  .card-price{font-size:16px}
  .card-stock{font-size:10px}

  .card-actions{
    padding:0 7px 8px;
  }

  .add{
    padding:8px 4px;
    font-size:11px;
  }

  .product-modal{padding:8px}

  .detail{margin:3px auto}

  .detail-body{
    grid-template-columns:1fr;
    gap:11px;
    padding:10px 12px 15px;
  }

  .gallery-slide{height:390px}

  .gallery-arrow{
    width:34px;
    height:34px;
    font-size:20px;
