<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02070b">
<title>LOE MOBIL | Tienda</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#05090d;
  --nav:#02070b;
  --panel:#0a151d;
  --panel2:#0d1d27;
  --blue:#00bfff;
  --blue2:#0095e8;
  --border:#143d52;
  --text:#fff;
  --muted:#95a4ad;
  --green:#19c86c;
  --yellow:#ffbf00;
}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.top{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(2,7,11,.98);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

.header-main{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 14px 8px;
}

.brand{
  min-width:max-content;
}

.brand-main{
  font-size:24px;
  line-height:1;
  font-weight:950;
}

.brand-main span{
  color:var(--blue);
}

.brand-sub{
  margin-top:5px;
  font-size:8px;
  letter-spacing:4px;
  text-align:center;
  color:#bcc8cf;
}

.account-btn{
  margin-left:auto;
  min-height:44px;
  max-width:170px;
  padding:0 12px;
  border:1px solid #146084;
  border-radius:10px;
  background:#07141d;
  color:white;
  font-size:13px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.account-btn.logged{
  border-color:#168f5a;
}

.cart-btn{
  min-height:44px;
  padding:0 12px;
  border:1px solid #146084;
  border-radius:10px;
  background:#07141d;
  color:white;
  font-weight:900;
  white-space:nowrap;
}

.cart-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:21px;
  height:21px;
  margin-left:4px;
  border-radius:50%;
  background:var(--blue);
  color:#00131b;
  font-size:12px;
}

.search-row{
  max-width:1400px;
  margin:auto;
  padding:0 14px 11px;
}

.search{
  display:flex;
  height:47px;
  overflow:hidden;
  border:1px solid #31566b;
  border-radius:10px;
  background:#0b1821;
}

.search input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  padding:0 15px;
  background:transparent;
  color:white;
}

.search input::placeholder{
  color:#88959e;
}

.search button{
  width:56px;
  border:0;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-size:21px;
}

.categories-wrap{
  overflow-x:auto;
  scrollbar-width:none;
  background:#030b11;
  border-top:1px solid rgba(0,191,255,.1);
}

.categories-wrap::-webkit-scrollbar{
  display:none;
}

.categories{
  max-width:1400px;
  margin:auto;
  display:flex;
  padding:0 8px;
}

.categories button{
  flex:0 0 auto;
  min-width:105px;
  padding:13px 14px;
  border:0;
  border-right:1px solid #112936;
  background:transparent;
  color:#dce5e9;
  font-weight:800;
}

.categories button.active{
  background:rgba(0,191,255,.13);
  color:white;
  box-shadow:inset 0 -3px var(--blue);
}

.quick{
  max-width:1400px;
  margin:12px auto 0;
  padding:0 12px;
}

.quick-box{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.quick-box::-webkit-scrollbar{
  display:none;
}

.quick-item{
  flex:0 0 auto;
  padding:9px 12px;
  border:1px solid #174960;
  border-radius:20px;
  background:#09151e;
  color:#cbd7dd;
  font-size:12px;
  font-weight:750;
}

main{
  max-width:1400px;
  margin:auto;
  padding:14px 10px 60px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.section-head h1{
  margin:0;
  font-size:25px;
}

.result-count{
  color:var(--blue);
  font-size:13px;
}

.status{
  padding:25px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#07131d;
  color:#a9b6bd;
  text-align:center;
}

.products{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
}

.card{
  overflow:hidden;
  border-radius:11px;
  background:white;
  color:#111;
  box-shadow:0 4px 18px rgba(0,0,0,.3);
}

.product-main{
  cursor:pointer;
}

.photo{
  position:relative;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:7px;
}

.no-image{
  color:#999;
  font-size:12px;
}

.badge{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 7px;
  border-radius:5px;
  background:#07131d;
  color:white;
  font-size:9px;
  font-weight:900;
}

.card-info{
  padding:9px 10px 7px;
}

.card-name{
  min-height:37px;
  font-size:14px;
  line-height:1.3;
  font-weight:850;
}

.card-meta{
  min-height:16px;
  margin-top:3px;
  color:#707980;
  font-size:11px;
}

/* CALIFICACIÓN DE PRODUCTO */

.card-rating{
  min-height:18px;
  margin-top:4px;
  display:flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
}

.card-stars{
  color:#f5a623;
  font-size:13px;
  letter-spacing:-1px;
}

.card-rating-number{
  color:#555;
  font-size:11px;
  font-weight:850;
}

.card-rating-count{
  color:#777;
  font-size:10px;
}

.card-no-reviews{
  color:#8a8a8a;
  font-size:10.5px;
}

.card-price{
  margin-top:7px;
  font-size:19px;
  font-weight:950;
}

.card-stock{
  margin-top:4px;
  color:#079c4e;
  font-size:11px;
  font-weight:800;
}

.card-actions{
  padding:0 9px 10px;
}

.add{
  width:100%;
  padding:9px 5px;
  border:0;
  border-radius:7px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:900;
}

.whatsapp{
  position:fixed;
  right:18px;
  bottom:20px;
  z-index:150;
  width:58px;
  height:58px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#15c96c;
  color:white;
  text-decoration:none;
  font-size:28px;
  box-shadow:0 5px 25px rgba(21,201,108,.35);
}

/* CARRITO */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.72);
}

.overlay.show{
  display:block;
}

.drawer{
  position:absolute;
  right:0;
  top:0;
  width:min(430px,94vw);
  height:100%;
  display:flex;
  flex-direction:column;
  background:#07131d;
  border-left:1px solid #0879a8;
}

.drawer-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px;
  border-bottom:1px solid var(--border);
}

.drawer-head h2{
  margin:0;
}

.close{
  border:0;
  background:transparent;
  color:white;
  font-size:29px;
}

#cartItems{
  flex:1;
  overflow:auto;
  padding:15px;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #163646;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:contain;
  background:white;
}

.cart-info{
  flex:1;
}

.cart-name{
  margin-bottom:4px;
  font-weight:850;
}

.remove{
  margin-top:5px;
  padding:0;
  border:0;
  background:transparent;
  color:#ff7777;
}

.cart-footer{
  padding:18px;
  border-top:1px solid var(--border);
}

.cart-total{
  margin-bottom:12px;
  font-size:20px;
  font-weight:950;
}

.checkout{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:900;
}

/* MODAL DE CUENTA */

.auth-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:500;
  padding:16px;
  overflow:auto;
  background:rgba(0,0,0,.85);
}

.auth-modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.auth-box{
  width:min(440px,100%);
  overflow:hidden;
  border:1px solid #126b91;
  border-radius:16px;
  background:#07131d;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.auth-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px 18px 12px;
  border-bottom:1px solid #163646;
}

.auth-head h2{
  margin:0;
  font-size:22px;
}

.auth-close{
  border:0;
  background:transparent;
  color:white;
  font-size:30px;
}

.auth-content{
  padding:18px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:18px;
}

.auth-tab{
  padding:11px;
  border:1px solid #174960;
  border-radius:8px;
  background:#0a1922;
  color:#aebcc4;
  font-weight:850;
}

.auth-tab.active{
  border-color:var(--blue);
  background:rgba(0,191,255,.15);
  color:white;
}

.auth-form{
  display:none;
}

.auth-form.active{
  display:block;
}

.auth-field{
  margin-bottom:13px;
}

.auth-field label{
  display:block;
  margin-bottom:6px;
  color:#cbd7dd;
  font-size:13px;
  font-weight:800;
}

.auth-field input{
  width:100%;
  min-height:46px;
  border:1px solid #25485a;
  border-radius:9px;
  outline:0;
  padding:0 12px;
  background:#0b1a24;
  color:white;
}

.auth-field input:focus{
  border-color:var(--blue);
}

.auth-submit{
  width:100%;
  min-height:47px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:950;
}

.auth-message{
  display:none;
  margin-top:13px;
  padding:10px 11px;
  border-radius:8px;
  font-size:13px;
  line-height:1.4;
}

.auth-message.show{
  display:block;
}

.auth-message.error{
  border:1px solid #7f3131;
  background:#301111;
  color:#ffb5b5;
}

.auth-message.success{
  border:1px solid #176b43;
  background:#0c2b1c;
  color:#a8f0cb;
}

.account-panel{
  padding:5px 0;
  text-align:center;
}

.account-avatar{
  width:72px;
  height:72px;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid var(--blue);
  border-radius:50%;
  background:#0b202c;
  font-size:31px;
}

.account-name{
  font-size:21px;
  font-weight:950;
}

.account-email{
  margin-top:5px;
  color:#96a7b0;
  font-size:13px;
}

.logout-btn{
  width:100%;
  margin-top:18px;
  padding:12px;
  border:1px solid #7f3131;
  border-radius:9px;
  background:#2a1111;
  color:#ffb8b8;
  font-weight:900;
}

/* DETALLE PRODUCTO */

.product-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:400;
  padding:12px;
  overflow:auto;
  background:rgba(0,0,0,.82);
}

.product-modal.show{
  display:block;
}

.detail{
  width:min(900px,100%);
  margin:14px auto;
  overflow:hidden;
  border:1px solid #0c7199;
  border-radius:15px;
  background:#07131d;
}

.detail-head{
  display:flex;
  justify-content:flex-end;
  padding:5px 8px 0;
}

.detail-close{
  border:0;
  background:transparent;
  color:white;
  font-size:31px;
}

.detail-body{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  padding:14px 16px 18px;
}

.gallery-wrap{
  min-width:0;
}

.gallery-shell{
  position:relative;
}

.gallery{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  scrollbar-width:none;
  border-radius:12px;
  background:white;
  -webkit-overflow-scrolling:touch;
}

.gallery::-webkit-scrollbar{
  display:none;
}

.gallery-slide{
  flex:0 0 100%;
  width:100%;
  height:430px;
  display:flex;
  align-items:center;
  justify-content:center;
  scroll-snap-align:start;
  background:white;
}

.gallery-slide img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:8px;
}

.gallery-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  width:38px;
  height:38px;
  border:1px solid rgba(0,0,0,.12);
  border-radius:50%;
  background:rgba(255,255,255,.92);
  color:#07131d;
  font-size:23px;
  font-weight:900;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.gallery-arrow.left{left:8px}
.gallery-arrow.right{right:8px}

.gallery-thumbs{
  display:flex;
  gap:7px;
  margin-top:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.gallery-thumbs::-webkit-scrollbar{
  display:none;
}

.gallery-thumb{
  flex:0 0 52px;
  width:52px;
  height:52px;
  padding:2px;
  overflow:hidden;
  border:2px solid transparent;
  border-radius:8px;
  background:white;
}

.gallery-thumb.active{
  border-color:var(--blue);
}

.gallery-thumb img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.gallery-counter{
  margin-top:5px;
  color:#9eabb2;
  text-align:center;
  font-size:11px;
}

.detail-brand{
  color:var(--blue);
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
}

.detail-title{
  margin:5px 0 7px;
  font-size:30px;
}

.detail-price{
  margin:10px 0;
  color:var(--blue);
  font-size:30px;
  font-weight:950;
}

.detail-stock{
  color:#37d47d;
  font-weight:850;
}

.detail-specs{
  display:grid;
  gap:7px;
  margin-top:14px;
}

.detail-specs div{
  padding:9px 10px;
  border-radius:7px;
  background:#0c1d28;
  font-size:14px;
}

.detail-desc{
  margin-top:14px;
  color:#c2ced4;
  line-height:1.5;
}

.detail-add{
  width:100%;
  margin-top:16px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:950;
}

/* RESEÑAS */

.reviews-section{
  grid-column:1/-1;
  margin-top:7px;
  padding-top:20px;
  border-top:1px solid #174052;
}

.reviews-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.reviews-title h3{
  margin:0;
  font-size:21px;
}

.rating-summary{
  color:var(--yellow);
  font-size:14px;
  font-weight:900;
}

.review-empty{
  padding:15px;
  border:1px solid #183746;
  border-radius:10px;
  background:#0a1821;
  color:#96a7b0;
  text-align:center;
  font-size:13px;
}

.review-card{
  margin-bottom:10px;
  padding:13px;
  border:1px solid #173a4c;
  border-radius:10px;
  background:#091821;
}

.review-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.review-name{
  font-size:14px;
  font-weight:900;
}

.review-date{
  margin-top:3px;
  color:#82949e;
  font-size:10px;
}

.review-stars{
  color:var(--yellow);
  letter-spacing:1px;
  white-space:nowrap;
}

.review-comment{
  margin-top:9px;
  color:#d4dde2;
  font-size:13px;
  line-height:1.5;
}

.review-form{
  margin-top:17px;
  padding:15px;
  border:1px solid #17516a;
  border-radius:11px;
  background:#0a1922;
}

.review-form h4{
  margin:0 0 12px;
  font-size:17px;
}

.review-login{
  padding:13px;
  border:1px solid #1a4d64;
  border-radius:9px;
  background:#081720;
  color:#b8c5cb;
  font-size:13px;
  text-align:center;
}

.review-login button{
  margin-top:9px;
  padding:9px 15px;
  border:0;
  border-radius:8px;
  background:var(--blue);
  color:#00141d;
  font-weight:900;
}

.star-picker{
  display:flex;
  gap:4px;
  margin-bottom:12px;
}

.star-picker button{
  padding:0;
  border:0;
  background:transparent;
  color:#54636a;
  font-size:31px;
  line-height:1;
}

.star-picker button.active{
  color:var(--yellow);
}

.review-form textarea{
  width:100%;
  min-height:100px;
  resize:vertical;
  border:1px solid #285063;
  border-radius:9px;
  outline:0;
  padding:11px;
  background:#07131d;
  color:white;
}

.review-form textarea:focus{
  border-color:var(--blue);
}

.review-submit{
  width:100%;
  margin-top:9px;
  padding:11px;
  border:0;
  border-radius:8px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:900;
}

.review-notice{
  display:none;
  margin-top:9px;
  padding:9px;
  border-radius:8px;
  font-size:12px;
}

.review-notice.show{
  display:block;
}

.review-notice.good{
  background:#0b2b1a;
  color:#9cf0c2;
}

.review-notice.bad{
  background:#311111;
  color:#ffb7b7;
}

@media(max-width:1100px){
  .products{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(max-width:820px){
  .products{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:650px){

  .header-main{
    padding:11px 9px 8px;
  }

  .brand-main{
    font-size:19px;
  }

  .brand-sub{
    font-size:6px;
    letter-spacing:3px;
  }

  .account-btn{
    max-width:86px;
    min-height:41px;
    padding:0 8px;
    font-size:11px;
  }

  .cart-btn{
    min-height:41px;
    padding:0 8px;
    font-size:12px;
  }

  .search-row{
    padding:0 10px 10px;
  }

  .categories button{
    min-width:92px;
    padding:12px 11px;
    font-size:13px;
  }

  .quick{
    padding:0 8px;
  }

  main{
    padding:13px 7px 55px;
  }

  .section-head h1{
    font-size:23px;
  }

  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }

  .card{
    border-radius:9px;
  }

  .photo img{
    padding:4px;
  }

  .card-info{
    padding:8px 8px 6px;
  }

  .card-name{
    min-height:34px;
    font-size:12.5px;
  }

  .card-meta{
    font-size:9.5px;
  }

  .card-rating{
    gap:3px;
  }

  .card-stars{
    font-size:11px;
  }

  .card-rating-number{
    font-size:9.5px;
  }

  .card-rating-count{
    font-size:9px;
  }

/* UTILIDADES */

function money(n){

  return "RD$" +
  Number(n || 0)
  .toLocaleString(
    "es-DO",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}

function safe(v){

  return String(v ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function getProductImages(p){

  let images = [];

  if(
    Array.isArray(p.images) &&
    p.images.length
  ){
    images = p.images.filter(Boolean);
  }

  if(
    !images.length &&
    p.image_url
  ){
    images = [p.image_url];
  }

  return [...new Set(images)];
}

function userName(){

  if(!currentUser){
    return "";
  }

  return (
    currentUser.user_metadata?.full_name ||
    currentUser.email?.split("@")[0] ||
    "Cliente"
  );
}

function authHeaders(){

  return {
    apikey:SUPABASE_KEY,
    Authorization:`Bearer ${accessToken}`,
    "Content-Type":"application/json"
  };
}

/* CALIFICACIONES */

function buildProductRatings(){

  productRatings = {};

  approvedReviews.forEach(review => {

    const productId =
    String(review.product_id);

    if(!productRatings[productId]){

      productRatings[productId] = {
        count:0,
        sum:0,
        average:0
      };
    }

    const rating =
    Number(review.rating || 0);

    productRatings[productId].count += 1;
    productRatings[productId].sum += rating;
  });

  Object.keys(productRatings)
  .forEach(productId => {

    const data =
    productRatings[productId];

    data.average =
    data.count
    ? data.sum / data.count
    : 0;
  });
}

function productRatingHtml(productId){

  const data =
  productRatings[String(productId)];

  if(!data || !data.count){

    return `
      <div class="card-rating">
        <span class="card-no-reviews">
          Sin opiniones
        </span>
      </div>
    `;
  }

  const rounded =
  Math.max(
    0,
    Math.min(
      5,
      Math.round(data.average)
    )
  );

  const stars =
  "★".repeat(rounded) +
  "☆".repeat(5-rounded);

  return `
    <div class="card-rating">

      <span class="card-stars">
        ${stars}
      </span>

      <span class="card-rating-number">
        ${data.average.toFixed(1)}
      </span>

      <span class="card-rating-count">
        (${data.count})
      </span>

    </div>
  `;
}

function openAccount(){

  .getElementById("authModal")

  renderAccountState();
}

  .getElementById("authModal")

function authOverlayClose(e){

  if(e.target.id === "authModal"){
    closeAccount();

}

function showAuthTab(tab){

  const login =
  tab === "login";

  document
  .getElementById("loginTab")
  .classList.toggle("active",login);

  document
  .getElementById("registerTab")
  .classList.toggle("active",!login);

  document
  .getElementById("loginForm")
  .classList.toggle("active",login);

  document
  .getElementById("registerForm")
  .classList.toggle("active",!login);

  clearAuthMessage();
}

function showAuthMessage(text,type){

  const box =
  document.getElementById("authMessage");

  box.textContent = text;

  box.className =
  `auth-message show ${type}`;
}

function clearAuthMessage(){

  const box =
  document.getElementById("authMessage");

  box.textContent = "";
  box.className = "auth-message";
}

async function registerUser(e){

  e.preventDefault();

  clearAuthMessage();

  const name =
  document
  .getElementById("registerName")
  .value.trim();

  const email =
  document
  .getElementById("registerEmail")
  .value.trim();

  const password =
  document
  .getElementById("registerPassword")
  .value;

  if(name.length < 2){

    showAuthMessage(
      "Escribe un nombre válido.",
      "error"
    );

    return;
  }

  if(password.length < 6){

    showAuthMessage(
      "La contraseña debe tener al menos 6 caracteres.",
      "error"
    );

    return;
  }

  const btn =
  document.getElementById("registerSubmit");

  btn.disabled = true;
  btn.textContent = "Creando cuenta…";

  try{

    const r =
    await fetch(
      `${SUPABASE_URL}/auth/v1/signup`,
      {
        method:"POST",
        headers:{
          apikey:SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email,
          password,
          data:{
            full_name:name
          }
        })
      }
    );

    const data =
    await r.json();

    if(!r.ok){

      throw new Error(
        data.msg ||
        data.message ||
        data.error_description ||
        "No se pudo crear la cuenta."
      );
    }

    document
    .getElementById("registerForm")
    .reset();

    if(
      data.access_token &&
      data.user
    ){

      saveSession(
        data.access_token,
        data.refresh_token || "",
        data.user
      );

      renderAccountState();

      showAuthMessage(
        "Cuenta creada correctamente.",
        "success"
      );

    }else{

      showAuthTab("login");

      showAuthMessage(
        "Cuenta creada. Revisa tu correo para confirmar la cuenta y luego inicia sesión.",
        "success"
      );
    }

  }catch(err){

    showAuthMessage(
      translateAuthError(err.message),
      "error"
    );

  }finally{

    btn.disabled = false;
    btn.textContent = "Crear mi cuenta";
  }
}

async function loginUser(e){

  e.preventDefault();

  clearAuthMessage();

  const email =
  document
  .getElementById("loginEmail")
  .value.trim();

  const password =
  document
  .getElementById("loginPassword")
  .value;

  const btn =
  document.getElementById("loginSubmit");

  btn.disabled = true;
  btn.textContent = "Entrando…";

  try{

    const r =
    await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {
        method:"POST",
        headers:{
          apikey:SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const data =
    await r.json();

    if(!r.ok){

      throw new Error(
        data.msg ||
        data.message ||
        data.error_description ||
        "No se pudo iniciar sesión."
      );
    }

    saveSession(
      data.access_token,
      data.refresh_token || "",
      data.user
    );

    document
    .getElementById("loginForm")
    .reset();

    renderAccountState();

    setTimeout(
      closeAccount,
      500
    );

    if(currentProductId){
      loadReviews(currentProductId);
    }

  }catch(err){

    showAuthMessage(
      translateAuthError(err.message),
      "error"
    );

  }finally{

    btn.disabled = false;
    btn.textContent = "Iniciar sesión";
  }
}

function saveSession(token,refresh,user){

  accessToken = token;
  currentUser = user;

  localStorage.setItem(
    "loeAccessToken",
    token || ""
  );

  localStorage.setItem(
    "loeRefreshToken",
    refresh || ""
  );

  if(user){

    localStorage.setItem(
      "loeUser",
      JSON.stringify(user)
    );
  }
}

function clearSession(){

  accessToken = "";
  currentUser = null;

  localStorage.removeItem(
    "loeAccessToken"
  );

  localStorage.removeItem(
    "loeRefreshToken"
  );

  localStorage.removeItem(
    "loeUser"
  );
}

async function restoreSession(){

  if(!accessToken){

    renderAccountState();

    return;
  }

  try{

    const r =
    await fetch(
      `${SUPABASE_URL}/auth/v1/user`,
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${accessToken}`
        }
      }
    );

    if(!r.ok){
      throw new Error();
    }

    currentUser =
    await r.json();

  }catch(err){

    const refreshed =
    await refreshSession();

    if(!refreshed){
      clearSession();
    }
  }

  renderAccountState();
}

async function refreshSession(){

  const refreshToken =
  localStorage.getItem(
    "loeRefreshToken"
  );

  if(!refreshToken){
    return false;
  }

  try{

    const r =
    await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,
      {
        method:"POST",
        headers:{
          apikey:SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          refresh_token:refreshToken
        })
      }
    );

    if(!r.ok){
      return false;
    }

    const data =
    await r.json();

    saveSession(
      data.access_token,
      data.refresh_token || refreshToken,
      data.user
    );

    return true;

  }catch(err){

    return false;
  }
}

async function logoutUser(){

  try{

    if(accessToken){

      await fetch(
        `${SUPABASE_URL}/auth/v1/logout`,
        {
          method:"POST",
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:`Bearer ${accessToken}`
          }
        }
      );
    }

  }catch(err){}

  clearSession();
  renderAccountState();
  closeAccount();

  if(currentProductId){
    loadReviews(currentProductId);
  }
}

function renderAccountState(){

  const btn =
  document.getElementById("accountBtn");

  const guest =
  document.getElementById("authGuest");

  const user =
  document.getElementById("authUser");

  if(currentUser){

    const name =
    userName();

    btn.textContent =

    btn.classList.add("logged");

    guest.style.display =
    "none";

    user.style.display =

    .getElementById("accountName")

    name;

    document
    .getElementById("accountEmail")

    currentUser.email || "";

  }else{

    btn.textContent =
    "👤 Ingresar";

    btn.classList.remove("logged");

    guest.style.display =
    "block";

    user.style.display =
    "none";
  }
}

function translateAuthError(msg){

  const text =
  String(msg || "").toLowerCase();

  if(
    text.includes("invalid login") ||
    text.includes("invalid credentials")
  ){
    return "Correo o contraseña incorrectos.";
  }

  if(
    text.includes("email not confirmed")
  ){
    return "Primero debes confirmar tu correo electrónico.";
  }

  if(
    text.includes("already registered") ||
    text.includes("already been registered")
  ){
    return "Ese correo ya tiene una cuenta.";
  }

  if(
    text.includes("password")
  ){
    return "Revisa la contraseña. Debe tener al menos 6 caracteres.";
  }

  if(
    text.includes("rate limit")
  ){
    return "Demasiados intentos. Espera un momento y vuelve a intentar.";
  }

  return msg || "Ocurrió un error.";
}

async function load(){

        `${SUPABASE_URL}/rest/v1/categories?select=*&order=id`,
        {headers}

      fetch(
        `${SUPABASE_URL}/rest/v1/reviews?select=product_id,rating&approved=eq.true`,
        {headers}
      )

    ]);

      !cr.ok ||

      !rr.ok
    ){

    }

    await rr.json();

function renderCategories(){

  const box =
  document.getElementById("cats");

  categories.forEach(cat => {

    const button =
    document.createElement("button");

    button.textContent =
    cat.name;

    button.dataset.id =
    cat.id;

    button.onclick = () => {

      document

        x.classList.remove("active")

      button
      .classList.add("active");

      currentCategory =
      String(cat.id);

      document
      .getElementById("sectionTitle")
      .textContent =
      cat.name;

      applyFilters();
    };

    box.appendChild(button);
  });

  box
  .querySelector('[data-id=""]')
  .onclick = () => {

    document
    .querySelectorAll("#cats button")
    .forEach(x =>
      x.classList.remove("active")
    );

    box
    .querySelector('[data-id=""]')
    .classList.add("active");

    currentCategory = "";

    document
    .getElementById("sectionTitle")
    .textContent =
    "Todos los productos";

    applyFilters();
  };
}

function applyFilters(){

  let list = [...products];

  if(currentCategory){

    list =
    list.filter(
      p =>
      String(p.category_id) ===
      currentCategory
    );
  }

  if(currentSearch){

    const q =
    currentSearch.toLowerCase();

    list =
    list.filter(p =>

      [
        p.name,
        p.brand,
        p.model,
        p.description,
        p.condition,
        p.color,
        p.storage
      ]

      .filter(Boolean)
      .join(" ")
      .toLowerCase()
      .includes(q)
    );
  }

  render(list);
}

function render(list){

  const status =
  document.getElementById("status");

  const grid =
  document.getElementById("products");

  const count =
  document.getElementById("resultCount");

  grid.innerHTML = "";

  count.textContent =
  `${list.length} producto${list.length === 1 ? "" : "s"}`;

  if(!list.length){

    status.style.display =
    "block";

    status.textContent =
    "No encontramos productos.";

    return;
  }

  status.style.display =
  "none";

  list.forEach(p => {

    const card =
    document.createElement("article");

    card.className =
    "card";

    const images =
    getProductImages(p);

    const portada =
    images[0] || "";

    const image =
    portada

    ? `<img
         src="${safe(portada)}"
         alt="${safe(p.name || "Producto")}"
         loading="lazy"
       >`

    : `<span class="no-image">
         Sin imagen
       </span>`;

    const meta =
    [
      p.brand,
      p.storage
    ]
    .filter(Boolean)
    .join(" · ");

    const badge =
    p.condition

    ? `<div class="badge">
         ${safe(p.condition)}
       </div>`

    : "";

/* DETALLE */

/* GALERÍA */

function setupGallery(){

  const gallery =
  document.getElementById("productGallery");

  if(!gallery){
    return;
  }

  const slides =
  gallery.querySelectorAll(".gallery-slide");

  if(slides.length <= 1){
    return;
  }

  gallery.addEventListener(
    "scroll",
    () => {

      const width =
      gallery.clientWidth;

      if(!width){
        return;
      }

      const index =
      Math.round(
        gallery.scrollLeft / width
      );

      currentGalleryIndex = index;

      updateGalleryUI(index);

    },
    {
      passive:true
    }
  );
}

function goToGalleryImage(index){

  const gallery =
  document.getElementById("productGallery");

  if(!gallery){
    return;
  }

  const total =
  gallery
  .querySelectorAll(".gallery-slide")
  .length;

  if(!total){
    return;
  }

  const safeIndex =
  Math.max(
    0,
    Math.min(index,total-1)
  );

  currentGalleryIndex =
  safeIndex;

  gallery.scrollTo({
    left:
      gallery.clientWidth *
      safeIndex,
    behavior:"smooth"
  });

  updateGalleryUI(
    safeIndex
  );
}

function galleryNext(){

  const gallery =
  document.getElementById("productGallery");

  if(!gallery){
    return;
  }

  const total =
  gallery
  .querySelectorAll(".gallery-slide")
  .length;

  if(!total){
    return;
  }

  const next =
  currentGalleryIndex + 1 >= total
  ? 0
  : currentGalleryIndex + 1;

  goToGalleryImage(next);
}

function galleryPrev(){

  const gallery =
  document.getElementById("productGallery");

  if(!gallery){
    return;
  }

  const total =
  gallery
  .querySelectorAll(".gallery-slide")
  .length;

  if(!total){
    return;
  }

  const prev =
  currentGalleryIndex - 1 < 0
  ? total - 1
  : currentGalleryIndex - 1;

  goToGalleryImage(prev);
}

function updateGalleryUI(index){

  const thumbs =
  document
  .querySelectorAll(".gallery-thumb");

  thumbs.forEach(
    (thumb,i) => {

      thumb.classList.toggle(
        "active",
        i===index
      );
    }
  );

  const counter =
  document
  .getElementById("galleryCounter");

  if(counter){

    counter.textContent =
    `${index+1} de ${thumbs.length}`;
  }

  const active =
  thumbs[index];

  if(active){

    active.scrollIntoView({
      behavior:"smooth",
      block:"nearest",
      inline:"center"
    });
  }
}

/* RESEÑAS */

async function loadReviews(productId){

  const list =
  document.getElementById("reviewsList");

  const summary =
  document.getElementById("ratingSummary");

  const formArea =
  document.getElementById("reviewFormArea");

  if(!list || !formArea){
    return;
  }

  list.innerHTML =
  '<div class="review-empty">Cargando opiniones…</div>';

  try{

    const reviewHeaders =
    currentUser && accessToken
    ? {
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${accessToken}`
      }
    : {
        apikey:SUPABASE_KEY
      };

    const r =
    await fetch(
      `${SUPABASE_URL}/rest/v1/reviews?select=id,product_id,user_id,name,rating,comment,approved,created_at&product_id=eq.${encodeURIComponent(productId)}&order=created_at.desc`,
      {
        headers:reviewHeaders
      }
    );

    if(!r.ok){
      throw new Error();
    }

    const allReviews =
    await r.json();

    const publicReviews =
    allReviews.filter(
      x => x.approved === true
    );

    renderReviews(
      publicReviews,
      summary,
      list
    );

    renderReviewForm(
      productId,
      allReviews,
      formArea
    );

  }catch(err){

    list.innerHTML =
    `<div class="review-empty">
      No se pudieron cargar las opiniones.
    </div>`;

    summary.textContent = "";

    renderReviewForm(
      productId,
      [],
      formArea
    );
  }
}

function renderReviews(reviews,summary,list){

  if(!reviews.length){

    summary.textContent =
    "Sin calificaciones";

    list.innerHTML =
    `<div class="review-empty">
      Este producto todavía no tiene opiniones.
      Sé el primero en calificarlo.
    </div>`;

    return;
  }

  const avg =
  reviews.reduce(
    (sum,r) =>
    sum + Number(r.rating || 0),
    0
  ) / reviews.length;

  summary.textContent =
  `${avg.toFixed(1)} ★ · ${reviews.length} reseña${reviews.length===1 ? "" : "s"}`;

  list.innerHTML =
  reviews.map(r => {

    const date =
    new Date(r.created_at);

    const dateText =
    Number.isNaN(date.getTime())
    ? ""
    : date.toLocaleDateString(
        "es-DO",
        {
          day:"numeric",
          month:"short",
          year:"numeric"
        }
      );

    return `
      <article class="review-card">

        <div class="review-top">

          <div>

            <div class="review-name">
              ${safe(r.name || "Cliente")}
            </div>

            <div class="review-date">
              ${safe(dateText)}
            </div>

          </div>

          <div class="review-stars">
            ${starsText(Number(r.rating))}
          </div>

        </div>

        <div class="review-comment">
          ${safe(r.comment)}
        </div>

      </article>
    `;

  }).join("");
}

function renderReviewForm(productId,allReviews,formArea){

  if(!currentUser){

    formArea.innerHTML = `
      <div class="review-login">
        <b>¿Compraste o conoces este producto?</b>
        <br>
        Inicia sesión para dejar tu calificación.
        <br>

        <button
          type="button"
          onclick="openAccount()"
        >
          Iniciar sesión
        </button>
      </div>
    `;

    return;
  }

  const ownReview =
  allReviews.find(
    x =>
    String(x.user_id) ===
    String(currentUser.id)
  );

  if(ownReview){

    if(ownReview.approved){

      formArea.innerHTML = `
        <div class="review-login">
          ✅ Ya calificaste este producto.
          Tu reseña está publicada.
        </div>
      `;

    }else{

      formArea.innerHTML = `
        <div class="review-login">
          ⏳ Tu reseña fue enviada y está
          pendiente de aprobación por LOE MOBIL.
        </div>
      `;
    }

    return;
  }

  selectedRating = 0;

  formArea.innerHTML = `

    <h4>
      Escribe tu opinión
    </h4>

    <div
      id="starPicker"
      class="star-picker"
    >

      ${[1,2,3,4,5].map(n => `
        <button
          type="button"
          data-rating="${n}"
          onclick="selectRating(${n})"
        >
          ★
        </button>
      `).join("")}

    </div>

    <textarea
      id="reviewComment"
      maxlength="1000"
      placeholder="Cuéntanos qué te pareció este producto..."
    ></textarea>

    <button
      id="reviewSubmit"
      class="review-submit"
      type="button"
      onclick="submitReview('${safe(String(productId))}')"
    >
      Enviar reseña
    </button>

    <div
      id="reviewNotice"
      class="review-notice"
    ></div>
  `;
}

function selectRating(n){

  selectedRating =
  Number(n);

  document
  .querySelectorAll(
    "#starPicker button"
  )
  .forEach(btn => {

    const value =
    Number(
      btn.dataset.rating
    );

    btn.classList.toggle(
      "active",
      value <= selectedRating
    );
  });
}

async function submitReview(productId){

  if(!currentUser || !accessToken){

    openAccount();
    return;
  }

  const commentBox =
  document.getElementById(
    "reviewComment"
  );

  const btn =
  document.getElementById(
    "reviewSubmit"
  );

  const comment =
  commentBox?.value.trim() || "";

  if(
    selectedRating < 1 ||
    selectedRating > 5
  ){

    showReviewNotice(
      "Selecciona de 1 a 5 estrellas.",
      false
    );

    return;
  }

  if(comment.length < 3){

    showReviewNotice(
      "Escribe un comentario un poco más completo.",
      false
    );

    return;
  }

  btn.disabled = true;
  btn.textContent =
  "Enviando…";

  try{

    let r =
    await fetch(
      `${SUPABASE_URL}/rest/v1/reviews`,
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify({
          product_id:Number(productId),
          user_id:currentUser.id,
          name:userName(),
          rating:selectedRating,
          comment,
          approved:false
        })
      }
    );

    if(
      r.status === 401 ||
      r.status === 403
    ){

      const refreshed =
      await refreshSession();

      if(refreshed){

        r =
        await fetch(
          `${SUPABASE_URL}/rest/v1/reviews`,
          {
            method:"POST",
            headers:{
              ...authHeaders(),
              Prefer:"return=representation"
            },
            body:JSON.stringify({
              product_id:Number(productId),
              user_id:currentUser.id,
              name:userName(),
              rating:selectedRating,
              comment,
              approved:false
            })
          }
        );
      }
    }

    if(!r.ok){

      const data =
      await r.json()
      .catch(() => ({}));

      if(
        String(
          data.code || ""
        ) === "23505"
      ){

        throw new Error(
          "Ya calificaste este producto."
        );
      }

      throw new Error(
        data.message ||
        "No se pudo enviar la reseña."
      );
    }

    showReviewNotice(
      "✅ Reseña enviada. Aparecerá cuando LOE MOBIL la apruebe.",
      true
    );

    setTimeout(
      () => loadReviews(productId),
      1000
    );

  }catch(err){

    showReviewNotice(
      err.message ||
      "No se pudo enviar la reseña.",
      false
    );

    btn.disabled = false;
    btn.textContent =
    "Enviar reseña";
  }
}

function showReviewNotice(text,good){

  const box =
  document.getElementById(
    "reviewNotice"
  );

  if(!box){
    return;
  }

  box.textContent =
  text;

  box.className =
  `review-notice show ${good ? "good" : "bad"}`;
}

function starsText(rating){

  const n =
  Math.max(
    0,
    Math.min(
      5,
      Math.round(
        Number(rating || 0)
      )
    )
  );

  return (
    "★".repeat(n) +
    "☆".repeat(5-n)
  );
}

/* CERRAR PRODUCTO */

function closeProduct(){

  document
  .getElementById("productModal")
  .classList.remove("show");

  currentProductId = null;
}

function detailOverlayClose(e){

  if(
    e.target.id ===
    "productModal"

/* CARRITO */

function addById(id){

  const p =
  products.find(
    x =>
    String(x.id) ===
    String(id)
  );

  if(p){
    addToCart(p);
  }
}

function addToCart(p){

  const found =
  cart.find(
    x =>
    String(x.id) ===
    String(p.id)
  );

  if(found){

    found.qty++;

  }else{

    const images =
    getProductImages(p);

    cart.push({
      id:p.id,
      name:p.name,
      price:Number(p.price || 0),
      image_url:
        images[0] ||
        p.image_url ||
        "",
      qty:1
    });
  }

  saveCart();
  updateCart();
}

function removeFromCart(id){

  cart =
  cart.filter(
    x =>
    String(x.id) !==
    String(id)
  );

  saveCart();
  updateCart();
}

function saveCart(){

  localStorage.setItem(
    "loeCart",
    JSON.stringify(cart)
  );
}

function updateCart(){

  const count =
  cart.reduce(
    (n,x) =>
    n + x.qty,
    0
  );

  document
  .getElementById("cartCount")
  .textContent =
  count;

  const box =
  document
  .getElementById("cartItems");

  box.innerHTML = "";

  if(!cart.length){

    box.innerHTML =
    '<div class="status">Tu carrito está vacío.</div>';

  }else{

    cart.forEach(x => {

      const row =
      document.createElement("div");

      row.className =
      "cart-item";

      row.innerHTML = `

        ${
          x.image_url

          ? `<img
               src="${safe(x.image_url)}"
               alt=""
             >`

          : `<div
               style="
                 width:65px;
                 height:65px;
                 background:#10232f
               "
             ></div>`
        }

        <div class="cart-info">

          <div class="cart-name">
            ${safe(x.name)}
          </div>

          <div>
            ${money(x.price)}
            ×
            ${x.qty}
          </div>

          <button
            class="remove"
            onclick='removeFromCart(${JSON.stringify(String(x.id))})'
          >
            Eliminar
          </button>

        </div>
      `;

      box.appendChild(row);
    });
  }

  const total =
  cart.reduce(
    (n,x) =>
    n + (x.price * x.qty),
    0
  );

  document
  .getElementById("cartTotal")
  .textContent =
  money(total);
}

function openCart(){

  document
  .getElementById("cartOverlay")
  .classList.add("show");
}

function closeCart(){

  document
  .getElementById("cartOverlay")
  .classList.remove("show");
}

function overlayClose(e){

  if(
    e.target.id ===
    "cartOverlay"
  ){
    closeCart();
  }
}

function checkout(){

  if(!cart.length){

    alert(
      "Tu carrito está vacío."
    );

    return;
  }

  let message =
  "Hola LOE MOBIL, quiero realizar este pedido:\n\n";

  cart.forEach(x => {

    message +=
    `• ${x.name} x${x.qty} - ${money(x.price * x.qty)}\n`;
  });

  const total =
  cart.reduce(
    (n,x) =>
    n + (x.price * x.qty),
    0
  );

  message +=
  `\nTotal: ${money(total)}`;

  if(currentUser){

    message +=
    `\n\nCliente: ${userName()}`;

    if(currentUser.email){

      message +=
      `\nCorreo: ${currentUser.email}`;
    }
  }

  window.open(
    "https://wa.me/18498898247?text=" +
    encodeURIComponent(message),
    "_blank"
  );
}
