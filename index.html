<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02070b">
<title>LOE MOBIL | Tienda</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#05090d;
  --nav:#02070b;
  --panel:#0a151d;
  --panel2:#0d1d27;
  --blue:#00bfff;
  --blue2:#0095e8;
  --border:#143d52;
  --text:#fff;
  --muted:#95a4ad;
  --green:#19c86c;
}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input{font:inherit}

.top{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(2,7,11,.98);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

.header-main{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px 8px;
}

.brand{min-width:max-content}

.brand-main{
  font-size:24px;
  line-height:1;
  font-weight:950;
}

.brand-main span{color:var(--blue)}

.brand-sub{
  margin-top:5px;
  font-size:8px;
  letter-spacing:4px;
  text-align:center;
  color:#bcc8cf;
}

.cart-btn{
  margin-left:auto;
  min-height:44px;
  padding:0 14px;
  border:1px solid #146084;
  border-radius:10px;
  background:#07141d;
  color:white;
  font-weight:900;
  cursor:pointer;
}

.cart-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:21px;
  height:21px;
  margin-left:5px;
  border-radius:50%;
  background:var(--blue);
  color:#00131b;
  font-size:12px;
}

.search-row{
  max-width:1400px;
  margin:auto;
  padding:0 14px 11px;
}

.search{
  display:flex;
  height:47px;
  overflow:hidden;
  border:1px solid #31566b;
  border-radius:10px;
  background:#0b1821;
}

.search input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  padding:0 15px;
  background:transparent;
  color:white;
}

.search input::placeholder{color:#88959e}

.search button{
  width:56px;
  border:0;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-size:21px;
  cursor:pointer;
}

.categories-wrap{
  overflow-x:auto;
  scrollbar-width:none;
  background:#030b11;
  border-top:1px solid rgba(0,191,255,.1);
}

.categories-wrap::-webkit-scrollbar{display:none}

.categories{
  max-width:1400px;
  margin:auto;
  display:flex;
  padding:0 8px;
}

.categories button{
  flex:0 0 auto;
  min-width:105px;
  padding:13px 14px;
  border:0;
  border-right:1px solid #112936;
  background:transparent;
  color:#dce5e9;
  font-weight:800;
  cursor:pointer;
}

.categories button.active{
  background:rgba(0,191,255,.13);
  color:white;
  box-shadow:inset 0 -3px var(--blue);
}

.quick{
  max-width:1400px;
  margin:12px auto 0;
  padding:0 12px;
}

.quick-box{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.quick-box::-webkit-scrollbar{display:none}

.quick-item{
  flex:0 0 auto;
  padding:9px 12px;
  border:1px solid #174960;
  border-radius:20px;
  background:#09151e;
  color:#cbd7dd;
  font-size:12px;
  font-weight:750;
}

main{
  max-width:1400px;
  margin:auto;
  padding:14px 10px 60px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.section-head h1{
  margin:0;
  font-size:25px;
}

.result-count{
  color:var(--blue);
  font-size:13px;
}

.status{
  padding:25px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#07131d;
  color:#a9b6bd;
  text-align:center;
}

.products{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
}

.card{
  overflow:hidden;
  border-radius:11px;
  background:white;
  color:#111;
  box-shadow:0 4px 18px rgba(0,0,0,.3);
}

.product-main{cursor:pointer}

.photo{
  position:relative;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:7px;
}

.no-image{
  color:#999;
  font-size:12px;
}

.badge{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 7px;
  border-radius:5px;
  background:#07131d;
  color:white;
  font-size:9px;
  font-weight:900;
}

.card-info{padding:9px 10px 7px}

.card-name{
  min-height:37px;
  font-size:14px;
  line-height:1.3;
  font-weight:850;
}

.card-meta{
  min-height:16px;
  margin-top:3px;
  color:#707980;
  font-size:11px;
}

.card-price{
  margin-top:7px;
  font-size:19px;
  font-weight:950;
}

.card-stock{
  margin-top:4px;
  color:#079c4e;
  font-size:11px;
  font-weight:800;
}

.card-actions{padding:0 9px 10px}

.add{
  width:100%;
  padding:9px 5px;
  border:0;
  border-radius:7px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:900;
  cursor:pointer;
}

.whatsapp{
  position:fixed;
  right:18px;
  bottom:20px;
  z-index:150;
  width:58px;
  height:58px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#15c96c;
  color:white;
  text-decoration:none;
  font-size:28px;
  box-shadow:0 5px 25px rgba(21,201,108,.35);
}

/* CARRITO */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.72);
}

.overlay.show{display:block}

.drawer{
  position:absolute;
  right:0;
  top:0;
  width:min(430px,94vw);
  height:100%;
  display:flex;
  flex-direction:column;
  background:#07131d;
  border-left:1px solid #0879a8;
}

.drawer-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px;
  border-bottom:1px solid var(--border);
}

.drawer-head h2{margin:0}

.close{
  border:0;
  background:transparent;
  color:white;
  font-size:29px;
}

#cartItems{
  flex:1;
  overflow:auto;
  padding:15px;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #163646;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:contain;
  background:white;
}

.cart-info{flex:1}

.cart-name{
  margin-bottom:4px;
  font-weight:850;
}

.remove{
  margin-top:5px;
  padding:0;
  border:0;
  background:transparent;
  color:#ff7777;
}

.cart-footer{
  padding:18px;
  border-top:1px solid var(--border);
}

.cart-total{
  margin-bottom:12px;
  font-size:20px;
  font-weight:950;
}

.checkout{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:900;
}

/* DETALLE */

.product-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:400;
  padding:12px;
  overflow:auto;
  background:rgba(0,0,0,.82);
}

.product-modal.show{display:block}

.detail{
  width:min(900px,100%);
  margin:14px auto;
  overflow:hidden;
  border:1px solid #0c7199;
  border-radius:15px;
  background:#07131d;
}

.detail-head{
  display:flex;
  justify-content:flex-end;
  padding:5px 8px 0;
}

.detail-close{
  border:0;
  background:transparent;
  color:white;
  font-size:31px;
}

.detail-body{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  padding:14px 16px 18px;
}

/* GALERÍA MEJORADA */

.gallery-wrap{
  min-width:0;
}

.gallery-shell{
  position:relative;
}

.gallery{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  scrollbar-width:none;
  border-radius:12px;
  background:white;
  -webkit-overflow-scrolling:touch;
}

.gallery::-webkit-scrollbar{display:none}

.gallery-slide{
  flex:0 0 100%;
  width:100%;
  height:430px;
  display:flex;
  align-items:center;
  justify-content:center;
  scroll-snap-align:start;
  background:white;
}

.gallery-slide img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:8px;
}

.gallery-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  width:38px;
  height:38px;
  border:1px solid rgba(0,0,0,.12);
  border-radius:50%;
  background:rgba(255,255,255,.92);
  color:#07131d;
  font-size:23px;
  font-weight:900;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
  cursor:pointer;
}

.gallery-arrow.left{left:8px}
.gallery-arrow.right{right:8px}

.gallery-thumbs{
  display:flex;
  gap:7px;
  margin-top:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.gallery-thumbs::-webkit-scrollbar{display:none}

.gallery-thumb{
  flex:0 0 52px;
  width:52px;
  height:52px;
  padding:2px;
  overflow:hidden;
  border:2px solid transparent;
  border-radius:8px;
  background:white;
  cursor:pointer;
}

.gallery-thumb.active{
  border-color:var(--blue);
}

.gallery-thumb img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.gallery-counter{
  margin-top:5px;
  color:#9eabb2;
  text-align:center;
  font-size:11px;
}

.detail-brand{
  color:var(--blue);
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
}

.detail-title{
  margin:5px 0 7px;
  font-size:30px;
}

.detail-price{
  margin:10px 0;
  color:var(--blue);
  font-size:30px;
  font-weight:950;
}

.detail-stock{
  color:#37d47d;
  font-weight:850;
}

.detail-specs{
  display:grid;
  gap:7px;
  margin-top:14px;
}

.detail-specs div{
  padding:9px 10px;
  border-radius:7px;
  background:#0c1d28;
  font-size:14px;
}

.detail-desc{
  margin-top:14px;
  color:#c2ced4;
  line-height:1.5;
}

.detail-add{
  width:100%;
  margin-top:16px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:950;
}

@media(max-width:1100px){
  .products{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(max-width:820px){
  .products{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:650px){

  .header-main{
    padding:11px 12px 8px;
  }

  .brand-main{font-size:21px}

  .brand-sub{font-size:7px}

  .cart-btn{
    padding:0 11px;
    font-size:14px;
  }

  .search-row{
    padding:0 10px 10px;
  }

  .categories button{
    min-width:92px;
    padding:12px 11px;
    font-size:13px;
  }

  .quick{padding:0 8px}

  main{
    padding:13px 7px 55px;
  }

  .section-head h1{
    font-size:23px;
  }

  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }

  .card{border-radius:9px}

  .photo img{padding:4px}

  .card-info{
    padding:8px 8px 6px;
  }

  .card-name{
    min-height:34px;
    font-size:12.5px;
  }

  .card-meta{font-size:9.5px}

  .card-price{font-size:16px}

  .card-stock{font-size:10px}

  .card-actions{
    padding:0 7px 8px;
  }

  .add{
    padding:8px 4px;
    font-size:11px;
  }

  .product-modal{
    padding:8px;
  }

  .detail{
    margin:3px auto;
  }

  .detail-body{
    grid-template-columns:1fr;
    gap:11px;
    padding:10px 12px 15px;
  }

  .gallery-slide{
    height:390px;
  }

  .gallery-arrow{
    width:34px;
    height:34px;
    font-size:20px;
  }

  .gallery-thumb{
    width:48px;
    height:48px;
    flex-basis:48px;
  }

  .detail-title{
    font-size:24px;
    margin-top:3px;
  }

  .detail-price{
    font-size:26px;
    margin:8px 0;
  }

  .detail-specs{
    margin-top:11px;
  }

  .detail-desc{
    margin-top:11px;
  }
}

@media(max-width:390px){
  .gallery-slide{
    height:350px;
  }
}
</style>
</head>

<body>

<header class="top">

  <div class="header-main">

    <div class="brand">
      <div class="brand-main">
        LOE <span>MOBIL</span>
      </div>

      <div class="brand-sub">
        FIX & GEAR
      </div>
    </div>

    <button
      class="cart-btn"
      onclick="openCart()"
    >
      🛒 Carrito
      <span
        class="cart-count"
        id="cartCount"
      >0</span>
    </button>

  </div>

  <div class="search-row">

    <div class="search">
      <input
        id="searchInput"
        type="search"
        placeholder="Buscar productos..."
      >

      <button id="searchBtn">
        ⌕
      </button>
    </div>

  </div>

  <div class="categories-wrap">

    <div
      id="cats"
      class="categories"
    >
      <button
        class="active"
        data-id=""
      >
        Todos
      </button>
    </div>

  </div>

</header>

<section class="quick">

  <div class="quick-box">
    <div class="quick-item">📱 Teléfonos</div>
    <div class="quick-item">🧩 Repuestos</div>
    <div class="quick-item">🔌 Accesorios</div>
    <div class="quick-item">🚚 Delivery</div>
    <div class="quick-item">🛠 Servicio técnico</div>
  </div>

</section>

<main>

  <div class="section-head">

    <h1 id="sectionTitle">
      Todos los productos
    </h1>

    <div
      id="resultCount"
      class="result-count"
    ></div>

  </div>

  <div
    id="status"
    class="status"
  >
    Cargando productos…
  </div>

  <div
    id="products"
    class="products"
  ></div>

</main>

<a
  class="whatsapp"
  href="https://wa.me/18498898247"
  target="_blank"
  aria-label="WhatsApp"
>
  ☏
</a>

<div
  id="cartOverlay"
  class="overlay"
  onclick="overlayClose(event)"
>

  <div class="drawer">

    <div class="drawer-head">

      <h2>Tu carrito</h2>

      <button
        class="close"
        onclick="closeCart()"
      >
        ×
      </button>

    </div>

    <div id="cartItems"></div>

    <div class="cart-footer">

      <div class="cart-total">
        Total:
        <span id="cartTotal">
          RD$0.00
        </span>
      </div>

      <button
        class="checkout"
        onclick="checkout()"
      >
        Pedir por WhatsApp
      </button>

    </div>

  </div>

</div>

<div
  id="productModal"
  class="product-modal"
  onclick="detailOverlayClose(event)"
>

  <div class="detail">

    <div class="detail-head">

      <button
        class="detail-close"
        onclick="closeProduct()"
      >
        ×
      </button>

    </div>

    <div
      id="detailBody"
      class="detail-body"
    ></div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://zndjyragtbobzuwxaaoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_eWJkT8ZBPv0ZcCSLo01P7g_0AAEbN6S";

const headers = {
  apikey: SUPABASE_KEY
};

let products = [];
let categories = [];
let currentCategory = "";
let currentSearch = "";
let currentGalleryIndex = 0;

let cart =
JSON.parse(
  localStorage.getItem("loeCart") || "[]"
);

function money(n){

  return "RD$" +
  Number(n || 0)
  .toLocaleString(
    "es-DO",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}

function safe(v){

  return String(v ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function getProductImages(p){

  let images = [];

  if(
    Array.isArray(p.images) &&
    p.images.length
  ){
    images = p.images.filter(Boolean);
  }

  if(
    !images.length &&
    p.image_url
  ){
    images = [p.image_url];
  }

  return [
    ...new Set(images)
  ];
}

async function load(){

  try{

    const [cr,pr] =
    await Promise.all([

      fetch(
        `${SUPABASE_URL}/rest/v1/categories?select=*&order=id`,
        {headers}
      ),

      fetch(
        `${SUPABASE_URL}/rest/v1/products?select=*&order=id.desc`,
        {headers}
      )

    ]);

    if(!cr.ok || !pr.ok){
      throw new Error();
    }

    categories = await cr.json();
    products = await pr.json();

    renderCategories();
    applyFilters();
    updateCart();

  }catch(err){

    document
    .getElementById("status")
    .textContent =
    "No se pudieron cargar los productos.";
  }
}

function renderCategories(){

  const box =
  document.getElementById("cats");

  categories.forEach(cat => {

    const button =
    document.createElement("button");

    button.textContent =
    cat.name;

    button.dataset.id =
    cat.id;

    button.onclick = () => {

      document
      .querySelectorAll("#cats button")
      .forEach(x =>
        x.classList.remove("active")
      );

      button
      .classList.add("active");

      currentCategory =
      String(cat.id);

      document
      .getElementById("sectionTitle")
      .textContent =
      cat.name;

      applyFilters();
    };

    box.appendChild(button);
  });

  box
  .querySelector('[data-id=""]')
  .onclick = () => {

    document
    .querySelectorAll("#cats button")
    .forEach(x =>
      x.classList.remove("active")
    );

    box
    .querySelector('[data-id=""]')
    .classList.add("active");

    currentCategory = "";

    document
    .getElementById("sectionTitle")
    .textContent =
    "Todos los productos";

    applyFilters();
  };
}

function applyFilters(){

  let list = [...products];

  if(currentCategory){

    list =
    list.filter(
      p =>
      String(p.category_id) ===
      currentCategory
    );
  }

  if(currentSearch){

    const q =
    currentSearch.toLowerCase();

    list =
    list.filter(p =>

      [
        p.name,
        p.brand,
        p.model,
        p.description,
        p.condition,
        p.color,
        p.storage
      ]

      .filter(Boolean)
      .join(" ")
      .toLowerCase()
      .includes(q)
    );
  }

  render(list);
}

function render(list){

  const status =
  document.getElementById("status");

  const grid =
  document.getElementById("products");

  const count =
  document.getElementById("resultCount");

  grid.innerHTML = "";

  count.textContent =
  `${list.length} producto${list.length === 1 ? "" : "s"}`;

  if(!list.length){

    status.style.display =
    "block";

    status.textContent =
    "No encontramos productos.";

    return;
  }

  status.style.display =
  "none";

  list.forEach(p => {

    const card =
    document.createElement("article");

    card.className =
    "card";

    const images =
    getProductImages(p);

    const portada =
    images[0] || "";

    const image =
    portada

    ? `<img
         src="${safe(portada)}"
         alt="${safe(p.name || "Producto")}"
         loading="lazy"
       >`

    : `<span class="no-image">
         Sin imagen
       </span>`;

    const meta =
    [
      p.brand,
      p.storage
    ]
    .filter(Boolean)
    .join(" · ");

    const badge =
    p.condition

    ? `<div class="badge">
         ${safe(p.condition)}
       </div>`

    : "";

    card.innerHTML = `

      <div
        class="product-main"
        onclick='openProduct(${JSON.stringify(String(p.id))})'
      >

        <div class="photo">

          ${badge}

          ${image}

        </div>

        <div class="card-info">

          <div class="card-name">
            ${safe(p.name || "Producto")}
          </div>

          <div class="card-meta">
            ${safe(meta)}
          </div>

          <div class="card-price">
            ${money(p.price)}
          </div>

          <div class="card-stock">
            ● Disponible
          </div>

        </div>

      </div>

      <div class="card-actions">

        <button
          class="add"
          onclick='addById(${JSON.stringify(String(p.id))})'
        >
          🛒 Agregar
        </button>

      </div>
    `;

    grid.appendChild(card);
  });
}

function openProduct(id){

  const p =
  products.find(
    x =>
    String(x.id) ===
    String(id)
  );

  if(!p){
    return;
  }

  currentGalleryIndex = 0;

  const images =
  getProductImages(p);

  let galleryHtml = "";

  if(images.length){

    const slides =
    images.map(
      (url,index) => `
        <div class="gallery-slide">
          <img
            src="${safe(url)}"
            alt="${safe(p.name)} ${index+1}"
          >
        </div>
      `
    ).join("");

    const thumbs =
    images.map(
      (url,index) => `
        <button
          class="gallery-thumb ${index===0 ? "active" : ""}"
          onclick="goToGalleryImage(${index})"
          type="button"
        >
          <img
            src="${safe(url)}"
            alt=""
          >
        </button>
      `
    ).join("");

    galleryHtml = `
      <div class="gallery-wrap">

        <div class="gallery-shell">

          <div
            id="productGallery"
            class="gallery"
          >
            ${slides}
          </div>

          ${
            images.length > 1
            ? `
              <button
                class="gallery-arrow left"
                type="button"
                onclick="galleryPrev()"
                aria-label="Foto anterior"
              >
                ‹
              </button>

              <button
                class="gallery-arrow right"
                type="button"
                onclick="galleryNext()"
                aria-label="Foto siguiente"
              >
                ›
              </button>
            `
            : ""
          }

        </div>

        ${
          images.length > 1

          ? `
            <div
              id="galleryThumbs"
              class="gallery-thumbs"
            >
              ${thumbs}
            </div>

            <div
              id="galleryCounter"
              class="gallery-counter"
            >
              1 de ${images.length}
            </div>
          `

          : ""
        }

      </div>
    `;

  }else{

    galleryHtml = `
      <div class="gallery-wrap">
        <div class="gallery-shell">
          <div class="gallery">
            <div class="gallery-slide">
              <div class="no-image">
                Sin imagen
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  const specs = [];

  if(p.brand){
    specs.push(
      `<div><b>Marca:</b> ${safe(p.brand)}</div>`
    );
  }

  if(p.model){
    specs.push(
      `<div><b>Modelo:</b> ${safe(p.model)}</div>`
    );
  }

  if(p.storage){
    specs.push(
      `<div><b>Almacenamiento:</b> ${safe(p.storage)}</div>`
    );
  }

  if(p.color){
    specs.push(
      `<div><b>Color:</b> ${safe(p.color)}</div>`
    );
  }

  if(p.condition){
    specs.push(
      `<div><b>Condición:</b> ${safe(p.condition)}</div>`
    );
  }

  document
  .getElementById("detailBody")
  .innerHTML = `

    ${galleryHtml}

    <div>

      <div class="detail-brand">
        ${safe(p.brand || "LOE MOBIL")}
      </div>

      <h2 class="detail-title">
        ${safe(p.name)}
      </h2>

      <div class="detail-price">
        ${money(p.price)}
      </div>

      <div class="detail-stock">
        ● Disponible
      </div>

      <div class="detail-specs">
        ${specs.join("")}
      </div>

      <div class="detail-desc">
        ${
          safe(
            p.description ||
            "Disponible en LOE MOBIL. Consulta disponibilidad y detalles por WhatsApp."
          )
        }
      </div>

      <button
        class="detail-add"
        onclick='addById(${JSON.stringify(String(p.id))});closeProduct()'
      >
        🛒 Agregar al carrito
      </button>

    </div>
  `;

  document
  .getElementById("productModal")
  .classList.add("show");

  setTimeout(
    setupGallery,
    0
  );
}

function setupGallery(){

  const gallery =
  document.getElementById("productGallery");

  if(!gallery){
    return;
  }

  const slides =
  gallery.querySelectorAll(".gallery-slide");

  if(slides.length <= 1){
    return;
  }

  gallery.addEventListener(
    "scroll",
    () => {

      const width =
      gallery.clientWidth;

      if(!width){
        return;
      }

      const index =
      Math.round(
        gallery.scrollLeft / width
      );

      currentGalleryIndex = index;

      updateGalleryUI(index);

    },
    {
      passive:true
    }
  );
}

function goToGalleryImage(index){

  const gallery =
  document.getElementById("productGallery");

  if(!gallery){
    return;
  }

  const total =
  gallery.querySelectorAll(".gallery-slide").length;

  if(!total){
    return;
  }

  const safeIndex =
  Math.max(
    0,
    Math.min(index,total-1)
  );

  currentGalleryIndex =
  safeIndex;

  gallery.scrollTo({
    left:
      gallery.clientWidth *
      safeIndex,

    behavior:"smooth"
  });

  updateGalleryUI(
    safeIndex
  );
}

function galleryNext(){

  const gallery =
  document.getElementById("productGallery");

  if(!gallery){
    return;
  }

  const total =
  gallery.querySelectorAll(".gallery-slide").length;

  if(!total){
    return;
  }

  const next =
  currentGalleryIndex + 1 >= total
  ? 0
  : currentGalleryIndex + 1;

  goToGalleryImage(next);
}

function galleryPrev(){

  const gallery =
  document.getElementById("productGallery");

  if(!gallery){
    return;
  }

  const total =
  gallery.querySelectorAll(".gallery-slide").length;

  if(!total){
    return;
  }

  const prev =
  currentGalleryIndex - 1 < 0
  ? total - 1
  : currentGalleryIndex - 1;

  goToGalleryImage(prev);
}

function updateGalleryUI(index){

  const thumbs =
  document
  .querySelectorAll(".gallery-thumb");

  thumbs.forEach(
    (thumb,i) => {

      thumb.classList.toggle(
        "active",
        i===index
      );
    }
  );

  const counter =
  document.getElementById("galleryCounter");

  if(counter){

    counter.textContent =
    `${index+1} de ${thumbs.length}`;
  }

  const active =
  thumbs[index];

  if(active){

    active.scrollIntoView({
      behavior:"smooth",
      block:"nearest",
      inline:"center"
    });
  }
}

function closeProduct(){

  document
  .getElementById("productModal")
  .classList.remove("show");
}

function detailOverlayClose(e){

  if(e.target.id === "productModal"){
    closeProduct();
  }
}

function addById(id){

  const p =
  products.find(
    x =>
    String(x.id) ===
    String(id)
  );

  if(p){
    addToCart(p);
  }
}

function addToCart(p){

  const found =
  cart.find(
    x =>
    String(x.id) ===
    String(p.id)
  );

  if(found){

    found.qty++;

  }else{

    const images =
    getProductImages(p);

    cart.push({
      id:p.id,
      name:p.name,
      price:Number(p.price || 0),
      image_url:
        images[0] ||
        p.image_url ||
        "",
      qty:1
    });
  }

  saveCart();
  updateCart();
}

function removeFromCart(id){

  cart =
  cart.filter(
    x =>
    String(x.id) !==
    String(id)
  );

  saveCart();
  updateCart();
}

function saveCart(){

  localStorage.setItem(
    "loeCart",
    JSON.stringify(cart)
  );
}

function updateCart(){

  const count =
  cart.reduce(
    (n,x) =>
    n + x.qty,
    0
  );

  document
  .getElementById("cartCount")
  .textContent =
  count;

  const box =
  document.getElementById("cartItems");

  box.innerHTML = "";

  if(!cart.length){

    box.innerHTML =
    '<div class="status">Tu carrito está vacío.</div>';

  }else{

    cart.forEach(x => {

      const row =
      document.createElement("div");

      row.className =
      "cart-item";

      row.innerHTML = `

        ${
          x.image_url

          ? `<img
               src="${safe(x.image_url)}"
               alt=""
             >`

          : `<div
               style="
                 width:65px;
                 height:65px;
                 background:#10232f
               "
             ></div>`
        }

        <div class="cart-info">

          <div class="cart-name">
            ${safe(x.name)}
          </div>

          <div>
            ${money(x.price)}
            ×
            ${x.qty}
          </div>

          <button
            class="remove"
            onclick='removeFromCart(${JSON.stringify(String(x.id))})'
          >
            Eliminar
          </button>

        </div>
      `;

      box.appendChild(row);
    });
  }

  const total =
  cart.reduce(
    (n,x) =>
    n + (x.price * x.qty),
    0
  );

  document
  .getElementById("cartTotal")
  .textContent =
  money(total);
}

function openCart(){

  document
  .getElementById("cartOverlay")
  .classList.add("show");
}

function closeCart(){

  document
  .getElementById("cartOverlay")
  .classList.remove("show");
}

function overlayClose(e){

  if(e.target.id === "cartOverlay"){
    closeCart();
  }
}

function checkout(){

  if(!cart.length){

    alert(
      "Tu carrito está vacío."
    );

    return;
  }

  let message =
  "Hola LOE MOBIL, quiero realizar este pedido:\n\n";

  cart.forEach(x => {

    message +=
    `• ${x.name} x${x.qty} - ${money(x.price * x.qty)}\n`;
  });

  const total =
  cart.reduce(
    (n,x) =>
    n + (x.price * x.qty),
    0
  );

  message +=
  `\nTotal: ${money(total)}`;

  window.open(
    "https://wa.me/18498898247?text=" +
    encodeURIComponent(message),
    "_blank"
  );
}

document.getElementById("searchInput");

searchInput

  () => {

    currentSearch =
    searchInput.value.trim();

    applyFilters();
  }
);

document
.getElementById("searchBtn")
.onclick = () => {

  currentSearch =
  searchInput.value.trim();

  applyFilters();
};

load();
